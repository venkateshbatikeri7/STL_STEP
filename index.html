<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert STL meshes to STEP files in your browser with OpenCascade. Your file never leaves your device."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f2" id="theme-color" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M16 6.5 25.5 11.75v8.5L16 25.5 6.5 20.25v-8.5z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/><path d='M6.5 11.75 16 17l9.5-5.25M16 17v8.5' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/></svg>"
    />
    <title>STL to STEP — private, in-browser converter</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem("stl2step-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
          var meta = document.getElementById("theme-color");
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#0b0c0e" : "#f6f5f2");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This converter runs entirely in your browser and needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
